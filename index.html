<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARCADIA Wiki</title>
  <meta name="description" content="ARCADIA (理想乡) world wiki — concepts, characters and timeline. 《理想乡》世界观百科。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,8 94,88 6,88' fill='%23D9443B'/><circle cx='50' cy='62' r='22' fill='%231b1b1b'/></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-mode="read">
  <header class="topbar">
    <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
    <a href="#/" class="brand"><span id="site-title">ARCADIA</span></a>
    <div class="top-tools">
      <input id="search" type="search" autocomplete="off">
      <label class="progress-sel" id="progress-wrap">
        <span id="progress-label"></span><select id="progress"></select>
      </label>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="zh">中文</button><button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav id="nav" class="nav"></nav>
    <main id="main" class="main"><p class="loading">…</p></main>
    <aside id="toc" class="toc"></aside>
  </div>

  <div id="toolbar"></div>
  <noscript>This site needs JavaScript. 这个网站需要开启 JavaScript。</noscript>
  <script>
    // 如果 4 秒后程序还没启动，多半是 assets 文件夹没放对位置
    setTimeout(function () {
      if (window.__wikiBooted) return;
      var m = document.getElementById('main');
      if (m) m.innerHTML = '<div style="max-width:640px;margin:40px auto;padding:20px;border:2px solid #b3262a;border-radius:10px;font:15px/1.7 sans-serif">' +
        '<b>网站文件没有加载成功 / Site files failed to load</b><br>' +
        '请确认仓库<b>根目录</b>里直接就有 <code>index.html</code>、<code>editor.html</code>、<code>assets</code> 文件夹和 <code>data</code> 文件夹，' +
        '而不是被放在另一个文件夹里面。上传时要把解压后文件夹<b>里面的东西</b>拖进去，不要上传 zip 本身。</div>';
    }, 4000);
  </script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
